spring:
  application:
    name: masterdata-service
  web:
    locale: en
    locale-resolver: accept-header
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    driverClassName: org.postgresql.Driver
    username: postgres
    password: secret
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
      # Derives each catalog's translations table/FK (brand_translations/brand_id, ...)
      # from its entity class name, so no catalog entity declares @CollectionTable.
      naming:
        implicit-strategy: io.masterdata.common.catalog.infrastructure.persistence.CatalogImplicitNamingStrategy
    properties:
      hibernate:
        default_schema: public
    show-sql: true

server:
  port: 8080

# OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Actuator
management:
  endpoints:
    web:
      exposure:
        # caches: standard cache list; per cache size and hit/miss stats in metrics (cache.*)
        include: health,info,metrics,caches
  endpoint:
    health:
      # details only for authenticated users with role ADMIN (see SecurityConfig)
      show-details: when-authorized
      roles: ADMIN
    caches:
      # unrestricted: allows DELETE /actuator/caches[/{name}] (clear caches) — /actuator/** other
      # than health/info requires role ADMIN (see SecurityConfig).
      access: unrestricted
  info:
    build:
      enabled: true
    env:
      enabled: true



#################################################################
#################################################################
#################################################################

app:
  # Locales documented as valid Accept-Language values in Swagger UI (see OpenApiConfig).
  i18n:
    supported-locales: en,es
  catalog:
    cache:
      provider: caffeine
      enabled: false
      maximum-size: 1000
      expire-after-write: 10m
      expire-after-access: 10m
      stats: true
    types:
      # Comunidades autónomas y provincias de España
      region:
        entity-class: io.masterdata.catalog.RegionEntity
        names:
          en: Autonomous community
          es: Comunidad autónoma
        cache:
          maximum-size: 100
          expire-after-write: 12h
      province:
        entity-class: io.masterdata.catalog.ProvinceEntity
        names:
          en: Province
          es: Provincia
        cache:
          maximum-size: 200
          expire-after-write: 12h
  # Configuración de seguridad básica para el acceso a los endpoints de la API y Swagger UI.
  # Se utiliza un usuario "admin" con contraseña encriptada.
  security:
    users:
      admin:
        password: "{bcrypt}$2a$10$dqxOOacf9UMOWdUcb.ROpeZgqmqM8kIGp7Yavrn.Wn6c4GqkPp45m"
        roles: [ADMIN]